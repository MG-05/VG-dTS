[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vg-dts-paper"
version = "1.0.0"
description = "Reproducible experiments for Variance-Gated Discounted Thompson Sampling"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "matplotlib==3.9.1.post1", "contourpy==1.3.2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
vgdts-reproduce = "project_publication.cli:main"

[tool.setuptools.packages.find]
include = ["src", "src.adts", "project_publication"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
